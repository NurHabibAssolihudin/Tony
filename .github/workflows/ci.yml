name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The engine (package.json, bun.lock, scripts) lives under engine/ after the
# Tony monorepo layout change. Run all shell steps there by default.
defaults:
  run:
    working-directory: engine

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_bump_only: ${{ steps.classify.outputs.release_bump_only }}
      run_heavy_ci: ${{ steps.classify.outputs.run_heavy_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect release-bump-only change
        id: classify
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TITLE=$(jq -er '.pull_request.title' "$GITHUB_EVENT_PATH")
            BASE_SHA=$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
            HEAD_SHA=$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          else
            TITLE=$(git log --format=%s "${{ github.event.before }}..${{ github.sha }}" | tail -n 1)
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          TITLE_MATCH=false
          if [[ "$TITLE" == chore:\ bump\ version\ to* ]]; then
            TITLE_MATCH=true
          fi

          FILES_MATCH=true
          if [ -z "$CHANGED_FILES" ]; then
            FILES_MATCH=false
          fi

          for file in $CHANGED_FILES; do
            case "$file" in
              package.json|engine/package.json) ;;
              *)
                FILES_MATCH=false
                ;;
            esac
          done

          RELEASE_BUMP_ONLY=false
          if [ "$TITLE_MATCH" = true ] && [ "$FILES_MATCH" = true ]; then
            RELEASE_BUMP_ONLY=true
          fi

          echo "release_bump_only=$RELEASE_BUMP_ONLY" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_BUMP_ONLY" = true ]; then
            echo "run_heavy_ci=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_heavy_ci=true" >> "$GITHUB_OUTPUT"
          fi

          echo "title=$TITLE"
          printf 'changed_files=%s\n' "$CHANGED_FILES"

  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Lint & Type Check
        run: bun run check

  # NOTE: the upstream `update-chain-smoke` job (npm self-update chain) was
  # removed. Tony runs the vendored engine from source in Docker and does not
  # distribute/self-update via npm, so that path is not exercised here.

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # PR selection needs the base/head SHAs.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      # Impacted unit tests on PRs; full unit suite on push to main.
      # Integration tests (API-gated) are never run here.
      - name: Run unit tests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node ../scripts/tony/run-unit-tests.mjs --changed-only --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
          else
            node ../scripts/tony/run-unit-tests.mjs
          fi

  node18-smoke:
    needs: [classify, check]
    if: needs.classify.outputs.run_heavy_ci == 'true'
    name: Node 18 Smoke Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Build bundle
        run: bun run build

      - name: Setup Node 18
        uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Verify Node version
        run: node --version

      - name: CLI smoke test (Node 18)
        run: node ./letta.js --help
