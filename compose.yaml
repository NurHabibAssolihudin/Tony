services:
  tony:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    stdin_open: true
    tty: true
    volumes:
      # Persistent agent state/memory (MemFS) across container rebuilds
      - tony-state:/root/.letta
      # Optional: mount a workspace for Tony to access, e.g.:
      # - ./:/workspace/project
    # LLM provider keys: copy .env.example to .env and fill in your key.
    # Loaded automatically when the file exists; never commit .env.
    env_file:
      - path: .env
        required: false

volumes:
  tony-state:
